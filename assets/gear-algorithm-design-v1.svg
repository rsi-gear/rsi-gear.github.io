<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="840" viewBox="0 0 1680 840" role="img" aria-labelledby="title desc">
<title id="title">Gear: From task experience to reusable agent improvements</title>
<desc id="desc">The inner loop exchanges actions, observations, and rewards between a rollout agent and its task environment. The outer loop diagnoses cross-task trajectories and evaluation feedback, proposes harness candidates, and evaluates and selects the harness for subsequent tasks. Model training is experimental; seed task generation is future work. Dashed extension branches do not represent an implemented joint optimization loop.</desc>
